name: CI

on:
  push:
    branches: [main, fix/*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverpkg=./datatables/... -coverprofile=coverage.out ./datatables/...
      - name: Mod tidy check
        run: go mod tidy && git diff --exit-code go.mod go.sum